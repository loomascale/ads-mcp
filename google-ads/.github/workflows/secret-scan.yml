name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly. New gitleaks rules land regularly, and a repo that was clean in
    # March can match a rule added in June with nobody ever re-running the scan.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required: the point is scanning history, not just HEAD

      # The gitleaks BINARY, not gitleaks/gitleaks-action: the action requires a
      # paid GITLEAKS_LICENSE for organization-owned repositories. The CLI is MIT.
      # Version is pinned, because a release that renames a subcommand would
      # otherwise turn this gate into a silent no-op.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      # --redact is not optional. This log is public: a scanner that prints the
      # match on failure has published the secret it just caught.
      - name: Scan full history
        run: |
          gitleaks git . --log-opts="--all --full-history" \
            -c .gitleaks.toml --redact -v --exit-code 1

      - name: Scan working tree
        run: gitleaks dir . -c .gitleaks.toml --redact -v --exit-code 1

      - name: No inline defaults in application config
        run: ./scripts/check-no-inline-defaults.sh
