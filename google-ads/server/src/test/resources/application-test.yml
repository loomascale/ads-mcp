spring:
  datasource:
    url: jdbc:h2:mem:googleads;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  liquibase:
    change-log: classpath:db/changelog/google-ads-mcp-master.xml

# Test-only literals. A fixture is exactly where a literal secret belongs, and a committed
# application.yml is exactly where it does not.
google-ads:
  client-id: test-client-id
  client-secret: test-client-secret
  developer-token: test-developer-token
  redirect-uri: http://localhost/connect/google/callback

oauth:
  issuer: http://localhost:8080
  access-token-secret: test-only-not-a-real-secret-do-not-use-anywhere-0000

mcp:
  # base64 of "test-key-not-real-not-a-secret!!" — exactly 32 bytes, as TokenCipher
  # requires. Deliberately readable when decoded, so nobody mistakes it for real.
  token-encryption-key: dGVzdC1rZXktbm90LXJlYWwtbm90LWEtc2VjcmV0ISE=
  consent:
    operator-password: test-operator-password
