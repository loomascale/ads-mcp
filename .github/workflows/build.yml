name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # CI checks formatting rather than applying it, so a PR cannot pass while
      # quietly reformatting the tree.
      - name: Check formatting
        run: ./mvnw --batch-mode --no-transfer-progress spotless:check

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
