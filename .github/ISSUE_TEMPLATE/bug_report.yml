name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: mcp-core version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - ChatGPT
        - Claude Desktop
        - Claude Code
        - curl / hand-driven
        - Other
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Java and Spring Boot versions
      placeholder: "Java 21.0.5, Spring Boot 3.4.2"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or configuration
      render: text

  # The likeliest future leak in this repository is a user pasting their config into an
  # issue. No scanner watches issue bodies, so this is a required checkbox rather than a
  # line of advice.
  - type: checkboxes
    id: scrubbed
    attributes:
      label: Before submitting
      options:
        - label: >
            I have removed every token, secret, signing key, encryption key, password,
            customer id and ad account id from the logs and configuration above.
          required: true
